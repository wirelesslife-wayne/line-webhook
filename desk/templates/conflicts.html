{% extends 'base.html' %}
{% block title %}知識庫衝突題・無限科技客服工作台{% endblock %}
{% block subtitle %}FB／IG／LINE 客服審稿 · 核准後才送出{% endblock %}
{% block user %}<form method="post" action="/desk/logout"><span>{{ staff.username }}</span><input name="csrf" type="hidden" value="{{ staff.csrf }}"><button>登出</button></form>{% endblock %}
{% block body %}<main>
<style nonce="{{ g.nonce }}">
/* Wayne 11/18: 知識庫衝突題 */
:root{--orange:#f08a24}header{background:linear-gradient(120deg,#0a2c46,#0f3d5c 55%,#14456b)}header form{margin-left:auto}main{max-width:820px;margin:0 auto}
.nav.main{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 0 12px}.nav.main a{text-decoration:none;padding:10px 2px;min-height:44px;font-size:17px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent}
.nav.main a[aria-current=page]{color:var(--ink);border-bottom-color:var(--orange)}
.cf .lead{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.cf .bar{height:10px;background:#e3e8ec;border-radius:999px;overflow:hidden;margin:6px 0 2px}.cf .bar i{display:block;height:100%;background:#2e8b57;border-radius:999px}
.cf .prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.cf .tabs{display:flex;gap:8px;margin:10px 0 4px}.cf .tabs button{flex:1;min-height:44px;font-size:15px}.cf .tabs button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.cf .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 2px #0f3d5c14}
.cf .grp{font-size:13px;color:var(--brand);background:var(--soft);border-radius:999px;padding:1px 9px;display:inline-block}
.cf .q h3{font-size:17px;margin:8px 0 10px;overflow-wrap:anywhere}
.cf .opt{display:block;position:relative;width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;padding:10px 12px 10px 44px;margin:8px 0;background:#fff;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.cf .opt small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.cf .opt::before{content:'';position:absolute;left:12px;top:14px;width:20px;height:20px;border:2px solid #879da9;border-radius:50%;background:#fff}.cf .opt[aria-pressed=true]{border-color:#2e8b57;background:#eef8f1}.cf .opt[aria-pressed=true]::before{border-color:#2e8b57;background:#2e8b57;box-shadow:inset 0 0 0 4px #fff}
.cf .ai{font-size:14px;color:var(--muted);background:#fafbfc;border:1px dashed #c9d3dc;border-radius:8px;padding:8px 10px;margin:8px 0 0}
.cf .own textarea{min-height:90px;font-size:16px;margin-top:8px}
.cf .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cf .row button{flex:1 1 30%;font-size:15px}.cf .row button.primary{flex:1 1 100%;font-size:17px;margin-bottom:12px}
.cf .chosen{background:#eef8f1;border-left:4px solid #2e8b57;border-radius:8px;padding:8px 12px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cf .meta{font-size:13px;color:var(--muted)}.cf .pager{display:flex;gap:8px;margin:10px 0}.cf .done{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;font-size:17px}
#feedback:empty{display:none}#feedback{position:sticky;top:0;z-index:5;background:#e8f5ec;border-radius:8px;padding:8px 12px}#feedback.bad{background:#fbe4e2;color:var(--bad)}
header form button{white-space:nowrap}header form span{white-space:nowrap}
@media(max-width:700px){header small{display:none}header{padding:10px 14px}header h1,header .title{font-size:17px}header form span{display:none}.nav.main{gap:16px}.nav.main a{font-size:16px}.cf .row button{flex:1 1 40%}}
</style>
<nav class="nav main" aria-label="客服管道"><a href="/desk/fb">客服審稿</a><a href="/desk/knowledge">AI 回覆依據</a><a href="/desk/conflicts" aria-current="page">衝突題</a></nav>
<div class="cf">
<p id="feedback" role="status"></p>
<p class="lead">這些題目以前回答過不同說法。<b>點現在正確的那個</b>，AI 之後照著寫。</p>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<div class="prog"><span id="prog">讀取中…</span></div>
<div class="tabs" role="group" aria-label="衝突題分頁"><button data-tab="open" aria-pressed="true">待決定 <span id="n-open"></span></button><button data-tab="later" aria-pressed="false">之後再說 <span id="n-later"></span></button><button data-tab="decided" aria-pressed="false">已決定 <span id="n-decided"></span></button></div>
<div id="list"><p class="muted">讀取中…</p></div>
<div class="pager"><button id="prev">上一頁</button><button id="next">下一頁</button></div>
</div>
</main><script nonce="{{ g.nonce }}">
const csrf={{ staff.csrf|tojson }};
{% include 'conflicts.js' %}
</script>{% endblock %}
